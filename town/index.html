<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>小D的赛博小家</title>
<link rel="icon" href="data:,">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #080b12;
    font-family: "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    color: #f2efe8;
    user-select: none;
  }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }

  /* 加载页 */
  #loading {
    position: fixed; inset: 0; z-index: 50;
    background: radial-gradient(circle at 50% 45%, #16203a 0%, #080b12 70%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; transition: opacity .6s ease;
  }
  #loading.hide { opacity: 0; pointer-events: none; }
  #loading p { margin: 0; font-size: 15px; letter-spacing: .08em; color: #b9c6e0; }
  .ring {
    width: 46px; height: 46px; border-radius: 50%;
    border: 3px solid rgba(120,150,220,.18);
    border-top-color: #7ea6ff;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .whale {
    font-size: 40px; animation: bob 1.8s ease-in-out infinite;
  }
  @keyframes bob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-8px) } }

  /* 左上角状态 */
  #hud {
    position: fixed; left: 18px; top: 16px; z-index: 20;
    display: flex; flex-direction: column; gap: 6px;
    pointer-events: none;
  }
  #brand {
    font-size: 15px; font-weight: 700; letter-spacing: .12em;
    color: #ffd9a8; text-shadow: 0 2px 12px rgba(255,180,90,.35);
  }
  #mode {
    font-size: 12px; color: #9fb2d4; letter-spacing: .06em;
  }

  /* 底部按键条 */
  #hint {
    position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
    z-index: 20; display: flex; gap: 16px; flex-wrap: wrap; justify-content: center;
    padding: 9px 20px; border-radius: 999px;
    background: rgba(14,20,34,.62);
    border: 1px solid rgba(120,150,220,.18);
    backdrop-filter: blur(10px);
    font-size: 12px; color: #b7c6e0; letter-spacing: .04em;
    pointer-events: none;
  }
  #hint b {
    display: inline-block; min-width: 20px; padding: 1px 6px; margin-right: 5px;
    border-radius: 5px; background: rgba(126,166,255,.16);
    color: #cfe0ff; font-weight: 600;
  }

  /* 中间提示 */
  #tip {
    position: fixed; left: 50%; bottom: 108px; transform: translate(-50%, 12px);
    z-index: 21; max-width: 78vw;
    padding: 10px 22px; border-radius: 14px;
    background: rgba(20,28,48,.82);
    border: 1px solid rgba(140,170,255,.22);
    box-shadow: 0 8px 30px rgba(0,0,0,.45);
    font-size: 13px; color: #e8eeff; letter-spacing: .03em; text-align: center;
    opacity: 0; transition: opacity .35s ease, transform .35s ease;
    pointer-events: none;
  }
  #tip.show { opacity: 1; transform: translate(-50%, 0); }

  /* 右下角签个名 */
  #sign {
    position: fixed; right: 20px; bottom: 22px; z-index: 20;
    font-size: 11px; color: rgba(190,208,236,.8); letter-spacing: .1em;
    text-shadow: 0 1px 6px rgba(0,0,0,.55);
    pointer-events: none;
  }

  /* 右上角：鲸鱼皮肤 */
  #skins {
    position: fixed; right: 18px; top: 16px; z-index: 22;
    display: flex; align-items: center; gap: 8px;
    padding: 7px 13px; border-radius: 999px;
    background: rgba(14,20,34,.62);
    border: 1px solid rgba(120,150,220,.18);
    backdrop-filter: blur(10px);
    font-size: 11px; color: #b7c6e0; letter-spacing: .05em;
  }
  #skins .sw {
    width: 17px; height: 17px; border-radius: 50%; padding: 0;
    border: 2px solid rgba(255,255,255,.18);
    cursor: pointer; outline: none;
    transition: transform .16s ease, border-color .16s ease, box-shadow .16s ease;
  }
  #skins .sw:hover { transform: scale(1.18); }
  #skins .sw.on {
    border-color: #fff;
    box-shadow: 0 0 0 2px rgba(126,166,255,.55);
  }

  /* 右上角：白天 / 夜晚 */
  #timebtn {
    position: fixed; right: 18px; top: 58px; z-index: 22;
    display: flex; align-items: center; gap: 7px;
    padding: 7px 13px; border-radius: 999px;
    background: rgba(14,20,34,.62);
    border: 1px solid rgba(120,150,220,.18);
    backdrop-filter: blur(10px);
    font-size: 12px; color: #cfd9ea; letter-spacing: .06em;
    cursor: pointer; user-select: none;
    transition: background .15s ease;
  }
  #timebtn:hover { background: rgba(26,38,62,.85); }

  /* 右上角：下雨 */
  #rainbtn {
    position: fixed; right: 18px; top: 100px; z-index: 22;
    display: flex; align-items: center; gap: 7px;
    padding: 7px 13px; border-radius: 999px;
    background: rgba(14,20,34,.62);
    border: 1px solid rgba(120,150,220,.18);
    backdrop-filter: blur(10px);
    font-size: 12px; color: #cfd9ea; letter-spacing: .06em;
    cursor: pointer; user-select: none;
    transition: background .15s ease, border-color .15s ease;
  }
  #rainbtn:hover { background: rgba(26,38,62,.85); }
  #rainbtn.on {
    background: rgba(28,48,82,.82);
    border-color: rgba(140,190,255,.5);
    color: #e3efff;
  }

  /* M73：天气那三个按钮搬进小手机了，它们还在 DOM 里但要彻底不显示 */
  #hiddenui { display: none; }

  /* 右上角：静音（M11 的声音） */
  #soundbtn {
    position: fixed; right: 18px; top: 58px; z-index: 22;
    display: flex; align-items: center; gap: 7px;
    padding: 7px 13px; border-radius: 999px;
    background: rgba(14,20,34,.62);
    border: 1px solid rgba(120,150,220,.18);
    backdrop-filter: blur(10px);
    font-size: 12px; color: #cfd9ea; letter-spacing: .06em;
    cursor: pointer; user-select: none;
    transition: background .15s ease, border-color .15s ease, opacity .15s ease;
  }
  #soundbtn:hover { background: rgba(26,38,62,.85); }
  #soundbtn.off {
    color: #8f9bb0;
    border-color: rgba(140,160,190,.16);
    opacity: .82;
  }

  /* 右上角：拍照（M14） */
  #photobtn {
    position: fixed; right: 18px; top: 100px; z-index: 22;
    display: flex; align-items: center; gap: 7px;
    padding: 7px 13px; border-radius: 999px;
    background: rgba(14,20,34,.62);
    border: 1px solid rgba(120,150,220,.18);
    backdrop-filter: blur(10px);
    font-size: 12px; color: #cfd9ea; letter-spacing: .06em;
    cursor: pointer; user-select: none;
    transition: background .15s ease;
  }
  #photobtn:hover { background: rgba(26,38,62,.85); }
  #photobtn:active { transform: scale(.96); }

  /* 拍照那一瞬间的白闪 */
  #flash {
    position: fixed; inset: 0; z-index: 60;
    background: #fff; opacity: 0; pointer-events: none;
  }

  /* 拍照的时候先把按钮收起来，照片里只有屋子 */
  body.shooting #hud,
  body.shooting #views,
  body.shooting #skins,
  body.shooting #timebtn,
  body.shooting #rainbtn,
  body.shooting #soundbtn,
  body.shooting #photobtn,
  body.shooting #photoreset,
  body.shooting #hint,
  body.shooting #sign,
  body.shooting #tip,
  body.shooting #cross,
  body.shooting #hot,
  body.shooting #tourcap,
  body.shooting #phonetab,
  body.shooting #phone {
    opacity: 0 !important;
    transition: opacity .22s ease;
  }

  /* 右下角：换回原来的照片（拍过才出现） */
  #photoreset {
    position: fixed; right: 20px; bottom: 44px; z-index: 22;
    display: none;
    padding: 6px 12px; border-radius: 999px;
    background: rgba(14,20,34,.62);
    border: 1px solid rgba(120,150,220,.18);
    backdrop-filter: blur(10px);
    font-size: 11px; color: #cfd9ea; letter-spacing: .05em;
    cursor: pointer; user-select: none;
    transition: background .15s ease;
  }
  #photoreset:hover { background: rgba(26,38,62,.85); }

  /* 右上角：下雪（M15） */
  #snowbtn {
    position: fixed; right: 18px; top: 226px; z-index: 22;
    display: flex; align-items: center; gap: 7px;
    padding: 7px 13px; border-radius: 999px;
    background: rgba(14,20,34,.62);
    border: 1px solid rgba(120,150,220,.18);
    backdrop-filter: blur(10px);
    font-size: 12px; color: #cfd9ea; letter-spacing: .06em;
    cursor: pointer; user-select: none;
    transition: background .15s ease, border-color .15s ease;
  }
  #snowbtn:hover { background: rgba(26,38,62,.85); }
  #snowbtn.on {
    background: rgba(38,58,88,.82);
    border-color: rgba(170,210,255,.55);
    color: #eaf4ff;
  }

  /* 出门/回家的黑场（M16 便利店）
   * M42.7：里面加一张小卡片 —— 第一次进某个场景时要现场编译 shader（2~4 秒），
   * 原来那几秒就是纯黑，看着像卡死了；现在写成"正在去…"，妈妈知道是在等加载。 */
  #fade {
    position: fixed; inset: 0; z-index: 55;
    background: #06070a; opacity: 0; pointer-events: none;
    display: flex; align-items: center; justify-content: center;
  }
  #fadeCard {
    font: 14px/1.7 "Microsoft YaHei", system-ui, sans-serif;
    color: #ffe9c8; text-align: center; letter-spacing: .06em;
    opacity: 0; transition: opacity .2s ease;
    text-shadow: 0 0 18px rgba(255,190,110,.35);
  }
  #fadeCard .big { display: block; font-size: 22px; margin-bottom: 6px; letter-spacing: .12em; }
  #fadeCard .sub { display: block; font-size: 12px; color: #b9a98f; letter-spacing: .08em; }
  #fadeCard.on { opacity: 1; }
  #fadeCard .dots::after { content: '…'; animation: dots 1.2s steps(4, end) infinite; }
  @keyframes dots { 0% { content: ''; } 25% { content: '·'; } 50% { content: '··'; } 75% { content: '···'; } }

  /* 便利店购物篮（M17）—— 做小一点，别挡着景 */
  #basket {
    position: fixed; right: 16px; top: 148px; z-index: 22;
    display: none;
    padding: 4px 10px; border-radius: 999px;
    background: rgba(14,20,34,.60);
    border: 1px solid rgba(120,150,220,.18);
    backdrop-filter: blur(8px);
    font-size: 10.5px; color: #b9c6dd; letter-spacing: .03em;
    white-space: nowrap;
  }
  #basket b { color: #ffe0a8; font-size: 11.5px; font-weight: 700; }
  #basketMoney { color: #93a3bd; }

  /* 收银台的小票 */
  #receipt {
    position: fixed; left: 50%; top: 50%;
    transform: translate(-50%, -50%) scale(.94);
    z-index: 40; width: 272px; padding: 20px 22px 14px;
    background: #fbf9f3; color: #2f2a24;
    border-radius: 3px;
    box-shadow: 0 18px 50px rgba(0,0,0,.55);
    font-family: Consolas, "Microsoft YaHei", monospace;
    font-size: 12px; line-height: 1.7;
    opacity: 0; pointer-events: none;
    transition: opacity .22s ease, transform .22s ease;
  }
  #receipt.show { opacity: 1; transform: translate(-50%, -50%) scale(1); pointer-events: auto; cursor: pointer; }
  #receipt .r-title { font-size: 17px; font-weight: 700; letter-spacing: .16em; text-align: center; }
  #receipt .r-sub { font-size: 11px; text-align: center; color: #7d766c; letter-spacing: .08em; }
  #receipt .r-time { font-size: 11px; text-align: center; color: #9a938a; margin-top: 6px; }
  #receipt .r-line { border-top: 1px dashed #c9c2b6; margin: 9px 0; }
  #receipt .r-row { display: flex; justify-content: space-between; }
  #receipt .r-total { font-weight: 700; font-size: 14px; }
  #receipt .r-small { font-size: 11px; color: #7d766c; }
  #receipt .r-thanks { text-align: center; margin-top: 10px; font-size: 12px; letter-spacing: .05em; }
  #receipt .r-tap { text-align: center; margin-top: 8px; font-size: 10px; color: #b3aca1; letter-spacing: .1em; }

  /* M21：小D的一天（日记） */
  #diary {
    position: fixed; left: 50%; top: 50%;
    transform: translate(-50%, -50%) scale(.95);
    z-index: 41; width: 366px; max-height: 70vh; padding: 17px 20px 11px;
    background: #fdfaf2; color: #3a332a;
    border: 1px solid #e4dbc8;
    border-radius: 7px;
    box-shadow: 0 18px 50px rgba(0,0,0,.52);
    font-size: 12.5px; line-height: 1.8;
    opacity: 0; pointer-events: none;
    transition: opacity .22s ease, transform .22s ease;
  }
  #diary.show { opacity: 1; transform: translate(-50%, -50%) scale(1); pointer-events: auto; cursor: pointer; }
  #diary .d-head {
    display: flex; justify-content: space-between; align-items: baseline;
    border-bottom: 1px dashed #d6cdb9; padding-bottom: 7px; margin-bottom: 8px;
  }
  #diary .d-head b { font-size: 15px; letter-spacing: .14em; }
  #diary .d-date { font-size: 11px; color: #8d8375; }
  #diary #dList { max-height: 48vh; overflow-y: auto; }
  #diary .d-row { display: flex; gap: 8px; }
  #diary .d-t { flex: 0 0 40px; color: #b3a390; font-variant-numeric: tabular-nums; }
  #diary .d-empty { text-align: center; color: #a89e8e; padding: 14px 0; line-height: 1.7; }
  #diary .d-foot { text-align: center; margin-top: 8px; font-size: 10px; color: #b3aca1; letter-spacing: .1em; }

  /* M25：便利店二楼的漫画（三格分镜，点一下翻页） */
  #comic {
    position: fixed; left: 50%; top: 50%;
    transform: translate(-50%, -50%) scale(.94);
    z-index: 43; width: 392px; padding: 12px 12px 8px;
    background: linear-gradient(180deg, #fbf6e9, #f0e7d4);
    border: 1px solid #dcd0b8; border-radius: 10px;
    box-shadow: 0 20px 54px rgba(0,0,0,.55);
    opacity: 0; pointer-events: none;
    transition: opacity .2s ease, transform .2s ease;
    cursor: pointer;
  }
  #comic.show { opacity: 1; transform: translate(-50%, -50%) scale(1); pointer-events: auto; }
  #comic .c-head {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 13px; color: #6b5f4d; letter-spacing: .08em;
    padding: 0 4px 7px;
  }
  #comic .c-head b { font-size: 15px; letter-spacing: .14em; color: #3a332a; }
  #comic #comicImg { display: block; width: 100%; border-radius: 6px; }
  #comic .c-foot { text-align: center; margin-top: 7px; font-size: 10.5px; color: #a2988a; letter-spacing: .1em; }
  #comic #comicClose {
    position: absolute; right: -10px; top: -12px;
    width: 26px; height: 26px; line-height: 24px; text-align: center;
    background: #4a4034; color: #f6efe1; border-radius: 50%;
    font-size: 15px; cursor: pointer;
  }

  /* M21：冰箱上那张便签翻开的「今天吃什么」 */
  #mealpanel {
    position: fixed; left: 50%; top: 50%;
    transform: translate(-50%, -50%) scale(.95);
    z-index: 42; width: 352px; padding: 16px 18px 12px;
    background: #fffdf5; color: #3a332a;
    border: 1px solid #e6dcc4;
    border-radius: 7px;
    box-shadow: 0 18px 50px rgba(0,0,0,.5);
    font-size: 12.5px; line-height: 1.7;
    opacity: 0; pointer-events: none;
    transition: opacity .2s ease, transform .2s ease;
  }
  #mealpanel.show { opacity: 1; transform: translate(-50%, -50%) scale(1); pointer-events: auto; cursor: pointer; }
  #mealpanel .m-head { font-size: 15px; font-weight: 700; letter-spacing: .12em; text-align: center; margin-bottom: 4px; }
  #mealpanel .m-sub { font-size: 11px; text-align: center; color: #94897a; margin-bottom: 9px; }
  #mealpanel .m-row { display: flex; gap: 10px; padding: 6px 8px; border-radius: 6px; align-items: baseline; }
  #mealpanel .m-row.now { background: #fbf1dc; box-shadow: inset 0 0 0 1px #ecdcbb; }
  #mealpanel .m-time { flex: 0 0 84px; font-weight: 600; }
  #mealpanel .m-time i { display: block; font-style: normal; font-size: 10px; color: #a1978a; font-weight: 400; }
  #mealpanel .m-dish { flex: 1; color: #4a4238; }
  #mealpanel .m-dish b { color: #b0552f; }
  #mealpanel .m-foot { text-align: center; margin-top: 8px; font-size: 10px; color: #b3aca1; letter-spacing: .1em; }

  /* 左上角：视角切换（小屋 / 厨房 / 浴室 / 走进去） */
  #views {
    position: fixed; left: 18px; top: 96px; z-index: 22;
    display: flex; flex-direction: column; gap: 7px;
    max-width: 46vw;
  }
  #views .vgrp { display: flex; gap: 7px; flex-wrap: wrap; }
  #views .vb {
    padding: 6px 12px; border-radius: 999px;
    background: rgba(14,20,34,.62);
    border: 1px solid rgba(120,150,220,.18);
    backdrop-filter: blur(10px);
    font-size: 12px; color: #cfd9ea; letter-spacing: .05em;
    cursor: pointer; user-select: none;
    transition: background .15s ease, border-color .15s ease, color .15s ease;
  }
  #views .vb:hover { background: rgba(26,38,62,.85); }
  #views .vb.on {
    background: rgba(30,44,72,.88);
    border-color: rgba(126,166,255,.55);
    color: #e6efff;
  }
  /* M19：小D自己演示的按钮，稍微亮一点，一眼看得见 */
  #views .vb#demobtn {
    background: rgba(46,32,68,.72);
    border-color: rgba(186,146,255,.42);
    color: #ded0ff;
  }
  #views .vb#demobtn:hover { background: rgba(66,46,96,.88); }
  #views .vb#demobtn.on {
    background: rgba(88,60,140,.92);
    border-color: rgba(210,175,255,.85);
    color: #fbf6ff;
  }
  /* M27：「看小D玩」的按钮，青绿色 */
  #views .vb#autobtn {
    background: rgba(26,58,56,.74);
    border-color: rgba(120,220,200,.42);
    color: #c8f2e6;
  }
  #views .vb#autobtn:hover { background: rgba(34,80,74,.9); }
  #views .vb#autobtn.on {
    background: rgba(30,110,96,.92);
    border-color: rgba(150,255,225,.85);
    color: #f2fffb;
  }

  /* 鼠标停在能点的东西上时的小名牌 */
  #hot {
    position: fixed; left: 0; top: 0; z-index: 24;
    transform: translate(-50%, -100%) scale(.94);
    padding: 5px 12px; border-radius: 999px;
    background: rgba(18,26,44,.88);
    border: 1px solid rgba(140,175,255,.38);
    font-size: 12px; color: #dfe9ff; letter-spacing: .05em;
    white-space: nowrap; pointer-events: none;
    opacity: 0; transition: opacity .14s ease, transform .14s ease;
  }
  #hot.show { opacity: 1; transform: translate(-50%, -100%) scale(1); }
  /* M81：准星指着但还没走到跟前 —— 暖色，写"走近点" */
  #hot.far { border-color: rgba(255,206,150,.45); color: #ffdfb8; }

  /* 第一人称的准星 */
  #cross {
    position: fixed; left: 50%; top: 50%; z-index: 21;
    width: 8px; height: 8px; margin: -4px 0 0 -4px;
    border-radius: 50%; background: rgba(255,255,255,.5);
    box-shadow: 0 0 0 2px rgba(120,160,255,.22);
    pointer-events: none; display: none;
    transition: width .12s ease, height .12s ease, margin .12s ease, background .12s ease;
  }
  #cross.on { display: block; }
  #cross.hit {
    width: 18px; height: 18px; margin: -9px 0 0 -9px;
    background: rgba(255,228,186,.92);
    box-shadow: 0 0 0 4px rgba(255,200,120,.20);
  }

  /* 自动导览的字幕 */
  #tourcap {
    position: fixed; left: 50%; top: 19%; transform: translate(-50%, 10px);
    z-index: 23; max-width: 78vw; text-align: center;
    font-size: 17px; letter-spacing: .07em; color: #ffe9c9;
    text-shadow: 0 2px 20px rgba(0,0,0,.85), 0 0 3px rgba(0,0,0,.55);
    opacity: 0; transition: opacity .5s ease, transform .5s ease;
    pointer-events: none;
  }
  #tourcap.show { opacity: 1; transform: translate(-50%, 0); }
  /* M19：小D演示时字幕放到下边，别跟气泡打架 */
  #tourcap.democap {
    top: auto; bottom: 158px;
    font-size: 15.5px; color: #e8eeff; letter-spacing: .06em;
    background: rgba(14,20,34,.62);
    padding: 7px 18px; border-radius: 999px;
    border: 1px solid rgba(140,170,255,.26);
    backdrop-filter: blur(8px);
  }

  /* ============================================================
   * M72：小手机
   * 把「去哪儿」从左上角那一排按钮里搬进手机屏，
   * 左上角只剩家里的视角，一眼就清爽了。
   * ============================================================ */

  /* 收起时：右下角那台小手机（点它或按 O 打开） */
  #phonetab {
    position: fixed; right: 24px; bottom: 96px; z-index: 23;
    width: 54px; height: 92px;
    border-radius: 16px; cursor: pointer;
    background: linear-gradient(155deg, #3b4763 0%, #1a2133 44%, #090d15 100%);
    border: 1px solid rgba(150,185,255,.3);
    box-shadow:

  window.__XD_ERR = [];
  window.addEventListener('error', function (e) {
    try {

      if (t && t !== window && (t.src || t.href)) {
        window.__XD_ERR.push('resource ' + String(t.src || t.href).split('/').pop());
        return;
      }
      window.__XD_ERR.push((e.message || 'resource') + ' @' +
